[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queryforgesql"
version = "0.1.0"
description = "A student-friendly execution-guided SQLite text-to-SQL research baseline"
requires-python = ">=3.11"
dependencies = ["sqlglot==30.27.0"]

[tool.setuptools.packages.find]
include = ["queryforgesql*", "scripts*"]
